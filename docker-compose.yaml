services:
  postgres:
    image: postgres:16-alpine
    container_name: dev_learning_tracker_db
    environment:
      POSTGRES_DB: learning_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/adapters/postgresql/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  dev-tracker-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      GOOSE_DBSTRING: "host=postgres user=postgres password=postgres dbname=learning_tracker sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "./cmd"]

  dev-tracker-backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8081:8080"
    environment:
      GOOSE_DBSTRING: "host=postgres user=postgres password=postgres dbname=learning_tracker sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
  dev-tracker-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - dev-tracker-backend
    environment:
      BACKEND_URL: "http://dev-tracker-backend:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

  dev-tracker-frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3001:3000"
    depends_on:
      - dev-tracker-backend
    environment:
      BACKEND_URL: "http://dev-tracker-backend:8080"
volumes:
  postgres_data:
